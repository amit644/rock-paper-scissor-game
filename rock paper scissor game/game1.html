<!DOCTYPE html>
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="game1.css"></link>
</head>
<body>
    <h1>Rock Paper Scissore Game</h1>

    <div class="choices">
        <div class="choice" id="rock">
            <img src="./image /rock.jpeg">
        </div>
        <div class="choice" id="paper">
            <img src="./image /paper.jpeg">
        </div>
        <div class="choice" id="scissore">
            <img src="./image /scissore.jpeg">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
    <script src="game1.js"></script>
</body>
</html>
